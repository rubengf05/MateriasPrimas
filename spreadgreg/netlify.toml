[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---- Proxy USDA AMS (Oculta la API key y evita CORS) ----
[[redirects]]
  from = "/ams-api/*"
  to = "https://oK/SXE39wQhwvn2TKtr3KG4kzecvwRa4:@marsapi.ams.usda.gov/services/v1.2/:splat"
  status = 200
  force = true

# ---- USDA NASS QuickStats -> Netlify Function ----
# NASS exige el parametro "key" y devuelve 401 si no llega. Un redirect no
# puede inyectar secretos, asi que /nass-api pasa por netlify/functions/nass.mjs,
# que anade la clave desde la variable de entorno NASS_API_KEY (Netlify >
# Site configuration > Environment variables). La clave nunca va en el repo
# ni llega al navegador.
[[redirects]]
  from = "/nass-api"
  to = "/.netlify/functions/nass"
  status = 200
  force = true

[[redirects]]
  from = "/nass-api/*"
  to = "/.netlify/functions/nass"
  status = 200
  force = true

# ---- Proxy Yahoo Finance ----
[[redirects]]
  from = "/yahoo/*"
  to = "https://query1.finance.yahoo.com/:splat"
  status = 200
  force = true

# Fallback de Yahoo por si query1 limita las peticiones
[[redirects]]
  from = "/yahoo2/*"
  to = "https://query2.finance.yahoo.com/:splat"
  status = 200
  force = true

# ---- Proxy CFTC (COT) ----
[[redirects]]
  from = "/api/cftc"
  to = "https://publicreporting.cftc.gov/resource/6dca-aqww.json"
  status = 200
  force = true

# IMPORTANTE: estos redirects deben ir SIEMPRE antes del catch-all de Next.js
# (@netlify/plugin-nextjs lo añade automáticamente al final del build)
